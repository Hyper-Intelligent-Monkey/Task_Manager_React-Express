services:
  - type: web
    name: task-management-system
    runtime: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_API_URL
        value: /api # This is the base path for the server API, change this if the client and server is deployed separately.
      # use this if the client and server is deployed separately
      # - key: CLIENT_URL
      #   sync: false